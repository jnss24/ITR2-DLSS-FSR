; itr2_dlss.ini - settings for the ITR2 DLSS mod (read once at game start; F6/F7/F8 change things live)

[General]
; 0 = off (nothing installed)
; 1 = hooks + log only (the view extension is registered but changes nothing)  <- start here
; 2 = passthrough: our upscaler copies the image (tests the RDG pass + RHI command path)
; 3 = DLSS
Mode=3
; 1 = also run on an exe that is not the analysed build (offsets unverified - risky)
AllowUnknownBuild=0

[DLSS]
; starting quality: DLAA | Quality | Balanced | Performance | UltraPerformance
Quality=DLAA
; starting render preset: letter (E = CNN, K = DLSS 4 transformer, M = DLSS 4.5), number, FSR (AMD, any GPU),
; or Auto (RTX 40/50: M, other RTX: K, other GPUs: FSR)
Preset=Auto
; overrides the render resolution (percent); 0 = use the value for Quality
ScreenPercentageOverride=0
; 1 = let DLSS compute exposure itself (try this if the image flickers or is too dark/bright)
AutoExposure=0
; set to -1 to flip a sign if the image wobbles/smears (debug)
JitterSignX=1
JitterSignY=1
MotionSignX=1
MotionSignY=1
; camera jump (cm) treated as a teleport -> DLSS history reset
TeleportResetCm=50
; 1 = turn off the game's VRS foveation (its Foveation menu setting) while DLSS is on (restored when off);
; 0 (default) = keep it: the game shades the edges of each eye more coarsely, together with the mod
DisableFoveation=0
; 1 = use the motion of the closest pixel in a 3x3 neighbourhood (less ghosting at object edges)
DilateMotionVectors=1
; when the upscaler turns on (start, F5): the engine's render-target pool minimum (r.RenderTargetPoolMin, the game
;   uses 400 MB) is set to 0 for this many seconds, so the engine frees the game TAA's targets it no longer uses,
;   then put back (freed memory stays freed). 0 = off. Not used when [CVars] sets r.RenderTargetPoolMin itself
PoolFlushSeconds=5
; key that toggles DLSS on/off in Mode=3 (virtual-key code, 116 = F5, 119 = F8, 0 = none)
ToggleKey=116
; key that cycles the render preset at runtime (118 = F7, 0 = none), through PresetCycle
; (FSR in the list = AMD FSR; without an NVIDIA RTX GPU the mod uses FSR only)
PresetKey=118
PresetCycle=E,J,K,L,M,FSR
; key that cycles the quality mode at runtime (117 = F6, 0 = none), through QualityCycle
; (DLAA is the default: with foveated upscaling and dynamic resolution it is affordable; M on the whole eye at DLAA costs ~5 ms per eye)
QualityKey=117
QualityCycle=UltraPerformance,Performance,Balanced,Quality,DLAA
; 1 = give DLSS per-eye copies of colour and depth starting at (0,0) (for add-ons that ignore
;     sub-rectangles, e.g. a DLSS 5 "pre-upscale" that only affects one eye); FSR always uses them
SeparateEyeInputs=0
; anti-ghosting mask from the game's separate translucency (UI text, particles, glass): tells DLSS
; (bias-current-colour mask) / FSR (reactive mask) to trust the current frame there. 1 = on at start
TranslucencyMask=0
; mask strength (translucent coverage x this, max 1); lower if translucent things start to shimmer
MaskScale=1
; key that toggles the mask at runtime (0 = none; F9 is now the foveated-upscaling key)
MaskKey=0
; depth image for the VR runtime (xr.OpenXRAllowDepthLayer): 0 = off (default: with it on, objects close to your
;   eyes smear in the headset whenever the render is below 100 %), 1 = leave the game's own setting
DepthLayer=0
; 1 = DLSS centre models (size steps of the dynamic resolution, the first model) are built on a side thread while the plain
;   edges stand in for the centre for a few frames, instead of the game waiting for them (key 0 in the debug build; only
;   with a DLSS centre and PLAIN edges). 0 = built on the render path, as before
AsyncRebuild=1

[Announce]
; spoken feedback when DLSS / model / quality changes (and once when the game starts):
; Voice (Windows speech, falls back to beeps) | Beep | Off. Plays where the game's sound plays (Device).
Mode=Voice
; 0..100
Volume=100
; speaking speed -10..10
Rate=1
; audio output whose name contains this text (e.g. Oculus); empty (default) = the output the game's own sound
; plays on (works with Link, Air Link, Steam Link, Virtual Desktop...); until the game has sound, a VR headset
; output found by name, else the Windows default. The log lists the outputs and says which one the voice uses.
Device=

[Foveated]
; foveated upscaling: the current DLSS model (F7) runs only on a window around each eye's lens centre;
; the rest of the eye uses a cheaper model, blended in with a soft elliptical edge. Needs a DLSS model in F7.
; 1 = on at start; F9 (Key) toggles it in game
Enabled=1
; edge model used when foveated starts on (Enabled=1): a DLSS preset letter (E = cheapest DLSS), FSR or PLAIN
PeripheryPreset=PLAIN
; F9 cycles: off -> foveated with each of these edge models -> off. PLAIN = no upscaler on the edges at all:
; the eye's render is stretched (jitter removed) and only the centre window gets the F7 model
Cycle=PLAIN,E,FSR
; PLAIN edges: set to -1 if the edges wobble or shimmer when you hold your head still
PlainJitterSign=1
; anti-aliasing of the PLAIN edges (key 1 cycles it): 0 = none, 1 = spatial (FXAA-style: smooths stair-steps,
;   no help against shimmer), 2 = temporal (a small TAA: smooth and steady, a little soft, may ghost slightly)
;   3 = fast temporal: ~15 % cheaper than 2 (5-pixel cross instead of 3x3); slightly less accurate on fine flickering patterns
PlainEdgeAA=2
; temporal: weight of the current frame, 0.02-1 (lower = smoother and steadier, more ghosting on fast motion)
PlainTaaBlend=0.1
; 1 = the anti-aliasing textures (keys 1 and 2) in a 4-byte format instead of 8: half the memory (~150 instead of
;   ~300 MB for the temporal mode at an 80 % render), rounded so colours do not drift; the pass is ~10 % slower
PlainTaaSmallHistory=1
; 1 = lean inputs: the motion-vector pass writes the DLSS / FSR centre window's inputs itself and
;   the plain edges and the mod's TAA read the game's own colour, so the whole-eye colour and depth copies are only
;   made when FSR runs on the whole eye or the edges. Same picture; ~0.1-0.3 ms per eye less GPU time and ~110 MB
;   per eye less VRAM (offline test at a 2938x3207 render); 0 = the old copies
LeanInputs=1
; 1 = the DLSS centre window reads its own cropped copy of colour, depth and motion (default). Presets J and K
;     pulse on a still image when they read the window as a sub-rectangle of the eye; 0 = sub-rectangle (old)
;   2 = only for presets J and K (the ones that pulse); other centre models read a sub-rectangle (less memory)
WindowCrop=1
; 1 = the DLSS centre is written straight into the eye's output (plain / half-size edges): no separate centre
;     texture, and the stretch pass skips the pixels the centre covers. 0 = the old way (separate texture)
CentreDirect=1
; window size as a fraction of the eye's width and height (0.6 = 60% x 60%, about 36% of the pixels)
Size=0.6
; width of the soft edge, as a fraction of the window's radius
Feather=0.3
; cycle key (120 = F9, 0 = none)
Key=120
; 1 = start with the edges computed at half the output size; only with DLSS edge models (E),
; the edge result is stretched to full size and the centre window laid over it
HalfResEdges=0
; 1 = follow the game's own foveation setting (graphics menu): Off / Low -> foveated off, Medium -> window
;     MediumSize, High / High Top -> window HighSize, centred where the game's foveation is (GameCentreX/Y,
;     the engine's fixed values read from the exe). Applied whenever the menu setting changes; F9 and key 7
;     still override it until the next change. 0 = only F9 / Enabled, window on the real lens centre.
FollowGame=1
MediumSize=0.7
HighSize=0.5
GameCentreX=0.575
GameCentreY=0.5

[DynamicRes]
; dynamic resolution: the render size is adjusted continuously to keep the GPU frame time at Headroom of the
; frame budget (1000/TargetHz ms). The render size moves between MinPercent and a ceiling: the F6 quality's
; size (QualitySetsCeiling=1), never above MaxPercent.
; 1 = on at start (default: only the render size moves; see OutputStage);
; 0 = the quality mode's fixed size. F8 (Key) toggles it in game
Enabled=1
; headset refresh rate (Hz); 0 = auto: from the VR runtime if it reports it, else measured from the frame rhythm
TargetHz=0
; aim for this fraction of the frame budget: 0.85 at 90 Hz = 9.4 ms of GPU time
Headroom=0.85
; 1 = while dynamic resolution runs, the F6 quality sets its ceiling: Ultra Performance and Performance 50
;     (DLSS cannot vary below 50, so the render stays at 50; for Ultra Performance's 33 turn dynamic resolution
;     off with F8; FSR can go to 33), Balanced 58, Quality 67, DLAA 100. MaxPercent below is still the upper
;     limit. A weaker GPU can then pick Quality and get a cheaper DLSS that still adapts. 0 = the ceiling is
;     MaxPercent whatever F6 says (F6 then does nothing while dynamic resolution runs)
QualitySetsCeiling=1
; v6: adaptive DLSS size. DLSS is made for the largest render it may get, and its cost follows that size, not the
; render (DLAA-sized: 2.34 ms/eye even at 50 % render; Quality-sized: 1.30). 1 = the size follows what the render
; uses (the Quality size, 75, 83, 91 or 100 %, up to the ceiling): smaller after 30 s under a smaller size, bigger (as a
; probe) after 12 s at the top with GPU room; at least 45 s between changes (each rebuilds DLSS: a short hitch).
; 0 = always the ceiling (before 2026-10-20)
AdaptiveSize=1
; v6.6: keep what dynamic resolution learns about this PC per setup (GPU, driver, eye image size, refresh rate,
; the mod's model / fovea / edges, the game's graphics menu) in itr2_dlss_profiles.txt next to the DLL; the next
; session starts from it, and (v6.10) one DLSS size step below the best size this setup held (the last one that
; passed its trial). 0 = learn from scratch every session (deleting the file forgets everything)
Profiles=1
; render size range, percent per side (50 = Performance, 67 = Quality, 100 = native/DLAA).
; DLSS cannot go below 50 while the size varies (FSR can go down to MinPercent, e.g. 33).
; v6.13: a session starts at Quality (67) at least, or at the profile's start size once it is known; only a start:
; the render drops under it at once when the GPU cannot hold it (down to the floor above).
; DLSS's cost is set by the ceiling, not by the current size (model M: about 1.4 ms per eye at 50,
; 2.5 at 67, 4.7 at 100, measured offline at 2448x2672 output, whole eye; foveated, only the centre window pays it).
; Default 50-100: full DLAA when the GPU has room. If heavy scenes stutter, lower MaxPercent (e.g. 80 or 67).
MinPercent=50
MaxPercent=100
; frames between adjustments
IntervalFrames=20
; second stage: the output size (the game's resolution setting), in 10% steps. Each change is one hitch
; (55-600 ms measured) and going up costs VRAM (+0.6-1.1 GB per step):
;  It follows the GPU time and frame pacing only. VRAM never changes the resolution: when the game is over
;  its VRAM budget, unused models are released at once instead (no resolution change).
;  fast:  render stuck at MinPercent and GPU over 1.3 x budget for 0.5 s -> down several steps at once
;  down:  render stuck at MinPercent and over budget for OutputDownHold s -> down 10%
;  up:    a probe of +10%: OutputProbeWait s after a drop at the earliest (and after any big overload), only
;         after OutputCooldown s since the last change, with the render at MaxPercent and headroom for
;         OutputUpHold s, no missed frame in 10 s, and the 8 s p90 GPU time (OutputUpElasticity of it scaled
;         by the new area) below OutputUpMargin x budget. A probe the render stage cannot carry within 15 s is
;         undone, and the wait doubles (20 -> 40 -> 80 -> 160 -> 240 s); a probe that holds 15 s resets it.
;  After F5/F8 only a supersampled output (over 100%) is resumed; a lower one restarts at the game's value.
; output changes at start: 0 = render size only (default: the output stays at the game's value; nothing can stay
; blurry, and no output-change hitches), 1 = on (supersampling up to OutputMax with spare GPU; each output change is a
; short hitch: measured ~0.3 s for a drop, ~0.16 s for a step up)
OutputStage=0
; output range, percent of the game's own resolution setting (above 100 = supersampling with spare GPU)
OutputMin=70
OutputMax=120
OutputCooldown=10
; seconds at the render ceiling with headroom before a raise
OutputUpHold=15
; seconds at the render floor over budget before a drop
OutputDownHold=2
; a raise must keep the predicted GPU time below this fraction of the budget (0.85 x 9.44 = 8.0 ms at 90 Hz)
OutputUpMargin=0.85
; share of the GPU time the raise prediction scales with the output area (measured 0.25-0.63 of it follows the
; resolution; 1 = the whole frame, the old, too pessimistic rule that kept the output at its minimum)
OutputUpElasticity=0.6
; seconds after an output drop before the first probe up, and the longest wait after repeated failed probes
OutputProbeWait=20
OutputProbeMaxWait=240
; dynamic resolution v5.2 (always on in the release build; in the debug build key 3 toggles it and key 4 swaps it
;  with the old controller every MissSwapSeconds; off = the old controller exactly):
;  - miss guard: every late frame (the headset skipped a refresh, from the VR runtime's display times) is GPU-caused
;    when the GPU took at least MissGpuFraction of the frame time and the game thread's own work did not overrun;
;    MissCount of those within MissWindow s drop the render at once (x0.9), then no raise above the failed level for
;    MissLock s (doubling while it keeps failing, up to MissLockMax). CPU-caused late frames and single rebuild
;    hitches (over 2.5 frames of GPU) change nothing, and nothing counts while dynamic resolution is off or warming up;
;    v5.2: nor while the old controller runs, nor during a GPU spike over 1.5 frames and the 3 s after it (the
;    runtime's half-rate stretch); switching to v5.2 starts with an empty window and no lock;
;  - cost model: learns how much of the GPU time follows the render size from its own steps, drops straight to the
;    size that fits and climbs in bigger steps; a raise also needs the slowest 10 % of the last 2.5 s under the budget;
;  - the 3 frames after a size change (still the old size) are not measured;
;  - budget learned both ways: lower when GPU-caused misses happen below Headroom's (v5.2: at most 0.6 ms lower, and
;    not from misses at the render floor), higher (up to 92 % of the frame)
;    after 30 s without them while the budget is what holds the render back;
;  - the refresh rate from the headset's frame period (TargetHz=0).
; 1 = on at start, 0 = off
MissGuard=1
MissGpuFraction=0.85
MissCount=2
MissWindow=1
MissLock=20
MissLockMax=240
; v5 motion rule: no raise while the camera turns faster than MotionTurnDps (degrees/s) or moves faster than
; MotionMoveMps (m/s), nor for 1 s after. Off (0) until the CSV columns cam_turn_dps / cam_move_mps show that the
; GPU time follows motion in this game
MotionHold=0
MotionTurnDps=90
MotionMoveMps=1.5
; toggle key (119 = F8, 0 = none)
Key=119

[Tweaks]
; image tweaks on the number keys above the letters (virtual-key codes: 49 = 1 ... 57 = 9, 48 = 0; 0 = no key).
; Each press cycles the value and the voice says it; the first step always puts back the game's own value.
; (keys 1-6 - sharpening, jitter length, mip bias, anisotropy, SSR, ambient occlusion - were removed on 2026-10-17:
;  no visible effect in game. To try an engine setting anyway, put it in the [CVars] section, e.g. r.MaxAnisotropy=16)
; 1: anti-aliasing of the plain foveated edges (none / spatial / temporal), see [Foveated] PlainEdgeAA
EdgeAaKey=49
; 5: A/B of the plain-edge jitter sign (old / new), see [Foveated] PlainJitterSign; starts from that value.
;    Hold your head still with plain edges (F9) and look at fine edges in the periphery (debug build only)
JitterSignKey=53
; 2: the mod's own temporal AA (key 1's TAA) on the whole screen instead of DLSS / FSR (off / on), to compare with the
;    game's TAA; F7 / F9 are ignored while it is on. It runs at the render size: set F6 to DLAA for a fair comparison
FullTaaKey=50
; 3: dynamic resolution's miss guard on / off (see [DynamicRes] MissGuard; debug build only)
MissGuardKey=51
; 4: automatic A/B every MissSwapSeconds: dynamic resolution with the DLAA ceiling (new controller, adaptive
;    DLSS size) <-> fixed Quality; the voice says "Dynamic D L A A." / "Quality fixed." at each swap. Dynamic
;    resolution resumes where it was and holds still for AbSettleSeconds after each swap. Press again to stop
;    (debug build only)
MissSwapKey=52
MissSwapSeconds=180
AbSettleSeconds=5
; 7: foveated window size (60% / 50% / 40% / 70%); the centre model is rebuilt once (short hitch)
FoveaSizeKey=55
; 8: output size = the game's resolution setting, in percent of its own value (100 / 90 / 80 / 70);
;    also moved by dynamic resolution's second stage (OutputStage)
OutputScaleKey=56
; -: low-memory mode (off / on, 189 = the - key). On: the mod keeps only the DLSS/FSR models and textures in use
;    (normally it keeps the others so switching back is instant; each costs about 165 MB (E) to 860 MB (M at
;    100%) per eye), and the engine streams textures LowMemoryMipBias mips lower with the pool capped to VRAM
LowMemoryKey=189
; <<: anti-aliasing while DLSS/FSR is off (F5): game TAA / MSAA 2x / MSAA 8x (no temporal blur; edges smoothed inside
;    each frame). Switching DLSS/FSR back on restores the game's TAA. -1 = the key that types << on your keyboard
;    layout (Portuguese: second key right of 0; else the ] key)
MsaaKey=-1
; 0: DLSS centre models built on a side thread (on / off), see [DLSS] AsyncRebuild (48 = the 0 key, debug build)
AsyncRebuildKey=48
; low-memory mode at start: 0 off (default), 1 on, 2 auto (on with less than 10 GB of VRAM)
LowMemory=0
LowMemoryMipBias=1

[FSR]
; AMD FSR settings (used when the preset is FSR). AMD's DLL picks the version for the GPU:
; FSR 3.1.x on any GPU, FSR 4 on Radeon RX 9000. Version= forces one by name (e.g. 3.1), empty = AMD's choice
Version=
; extra sharpening 0..1 (0 = off; sharpening shimmers more in VR)
Sharpness=0
; set to -1 to flip a sign if FSR wobbles/smears while DLSS looks right (debug)
JitterSignX=1
JitterSignY=1

[Debug]
; TEST ONLY - low-VRAM simulation: hold this much video memory on the game's GPU so the game has less
; (8192 on a 16 GB card = about an 8 GB card, VR runtime included). The voice says so at start. 0 = off
VramBallastMb=0
; TEST ONLY: VRAM size the mod's auto settings assume (LowMemory=2 turns on under 10 GB); 0 = the real size
FakeVramMb=0
; number of frames per eye with detailed log lines
VerboseFrames=8
; 1 = write NGX's own log lines into itr2_dlss.log
NGXLogging=0

[Perf]
; performance log: CSV itr2_dlss_perf_<date>.csv next to the DLL (one row per interval, says DLSS ON/OFF/MIX)
Enabled=1
; CSV row interval in milliseconds (minimum 100)
IntervalMs=500
; summary line with 1% low in itr2_dlss.log every N seconds
SummarySeconds=10

[Screenshot]
; screenshot key (122 = F11; 0 = off): saves a PNG of the image the game sends to the headset, at full
;    resolution (much sharper than Steam's F12, which only grabs the small desktop window).
;    The file name says what was on screen: ..._TAA.png, ..._DLSS-M-Quality.png, ..._FSR-Balanced-foveated.png
Key=122
; folder for the PNGs; empty = itr2_dlss_shots next to the mod
Folder=
; path of OculusMirror.exe; empty = found from the Oculus install (Support\oculus-diagnostics)
MirrorExe=
; mirror options: --LeftEyeOnly or --RightEyeOnly or --RectilinearBothEyes; --NativeResolution = 1:1 pixels
MirrorArgs=--LeftEyeOnly --NativeResolution --DisableTimewarp
; Mod (default) = the mod copies the finished eye image itself, at full resolution (e.g. 4080x4464 per eye);
;    Mirror = Meta's OculusMirror.exe (limited to the size of your monitor; Oculus runtime only)
Method=Mod
; Left, Right or Both (both eyes side by side); Mod method only
Eye=Left
; 1 = convert the game's linear colour values with the sRGB curve, as the headset does (correct brightness);
;    0 = raw values (much darker). Mod method only
SrgbEncode=1
; 1 = one press takes a comparison: a shot as you are, then DLSS/FSR switched (like F5), a second shot, and
;    back; plus <time>_compare.html with a before/after slider (game TAA left, the mod right). Keep the view
;    still for ~5 s. 0 = a single screenshot. Mod method and Mode=3 only
Pair=1
; wait after switching before the second shot, in ms (the temporal AA / DLSS needs a moment to settle)
PairSettleMs=2000
; wait after the key before recording starts, in ms: pressing the key shakes a headset resting on the desk
;    (measured: the camera turned up to 0.8 px per frame for about half a second)
StartDelayMs=1500
; 1 = the comparison viewer lines the two shots up (your head moves a little between them); key A in the
;    viewer turns it off and on. 0 = no alignment
Align=1
; 1 = the comparison also records a short burst of consecutive frames before and after the switch (a crop
;    around the centre of view, MotionWidth x MotionHeight) and writes what a still photo cannot show:
;    <time>_flicker.png (shimmer map: how much each pixel changes from frame to frame, side by side),
;    <time>_motion.mp4 (both loops side by side), <time>_wipe.mp4 and <time>_flicker_wipe.mp4 (the two
;    overlaid, a line sweeping left to right: the mod left of the line, the game's TAA right of it) and
;    <time>_motion.html (lossless loops, frame stepping, zoom, the wipes with a line you can hold with the
;    mouse). Hold your head still. 0 = photos only
Motion=1
; frames per burst (4-64); at 72 fps 32 frames = 0.44 s
MotionFrames=32
; crop size in pixels (even numbers, 128-4096)
MotionWidth=960
MotionHeight=540
; 1 = steady the recorded frames like the headset's timewarp does (each frame's small overall camera shift is
;    taken out before the shimmer map and videos are made; the game's camera jumps up to ~1 px for single frames,
;    which the headset hides but a raw video shows magnified). 0 = raw frames
MotionSteady=1

[Benchmark]
; one key runs a benchmark with the view held still (headset on a table, proximity sensor bypassed): the game's
; TAA, then every model of Models (empty = the F7 PresetCycle) at each of Qualities, with the current foveated
; settings (dynamic resolution paused), then the game's TAA again. At each checkpoint: SettleMs wait, MeasureMs of
; GPU time / the mod's GPU time per eye / VRAM, then a burst of frames (footage + shimmer map) and a full-resolution
; screenshot. Unused models are released at once while it runs. Results in itr2_dlss_shots\itr2_<date>_<time>_benchmark...\:
; <name>_benchmark.csv and <name>_benchmark.html (table + viewer: pick any two checkpoints, a line sweeps across the
; footage, shimmer maps or screenshots). About 5-6 minutes and 0.8-1 GB per run with 6 models x 4 qualities.
; Press the key again to stop. 121 = F10, 0 = off
Key=121
; wait after each model / quality change (model creation, temporal history), ms
SettleMs=4000
; wait after switching the upscaler off for the TAA checkpoints (the mod frees its models after 10 s), ms
BaselineMs=12000
; measuring time per checkpoint, ms
MeasureMs=4000
; qualities to test (Performance = 50 %, Balanced = 58 %, Quality = 66.7 %, DLAA = 100 %, UltraPerformance = 33 %)
Qualities=UltraPerformance,Performance,Quality,DLAA
; models to test, e.g. E,J,K,L,M,FSR; empty = the F7 PresetCycle
Models=
; 1 = a burst of frames per checkpoint (footage and shimmer map in the page), 1 = a screenshot per checkpoint
Footage=1
Screenshots=1
; 1 = clean VRAM per setting: before each checkpoint the upscaler goes off for GapMs (no frame in flight still uses the
;    models), everything the mod holds is released, and the VRAM level is recorded once stable; the page's "Own VRAM" is
;    the setting's VRAM minus that level. 0 = no release (values then depend on the order of the checkpoints)
ReleaseBetween=1
GapMs=1000
; VRAM counts as stable when it stays within StableMb (max - min) for StableMs; the wait for it lasts at most StableMaxMs
StableMs=2000
StableMb=20
StableMaxMs=8000

[CVars]
; console variables applied once at the first frame (SetByCode), e.g. experiments:
; r.Velocity.ForceOutput=1

[Test]
; test keys, as Windows key codes (0 = no key; the AMD test build has its own: F1 F2 F4 R G N A, mask M, screenshot C):
; 112 = F1 the exposure FSR gets (the game's / FSR's own / none), 113 = F2 the next FSR version the runtime lists,
; 115 = F4 output cleanup (NaN, infinite and negative colour -> 0, alpha 1), 82 = R every upscaler history starts again,
; 71 = G output in the game's own format (R11G11B10) <-> RGBA16F, 78 = N the upscaler's colour input cleaned (NaN, infinite
; and negative -> 0, at most 4096), 65 = A automatic reset (an eye whose output gets NaN, infinite or many very bright pixels
; starts its history again). The translucency mask key is [DLSS] MaskKey.
FsrExposureKey=0
FsrVersionKey=0
CleanKey=0
ResetKey=0
OutFormatKey=0
InCleanKey=0
AutoResetKey=0
; 1 = diagnostics in the log: bad pixels in each eye's output and in the game's colour going in, the game's exposure per eye
;     ("probe" lines), the finished image per eye ("final image"), history resets, FSR's own input checks
OutputProbe=0

[DLSS5]
; optional DLSS 5 (Neural Rendering) on the foveated centre window when itr2_dlss5_bridge.dll and nvngx_dlssnr.dll are in the folder:
; 0 = off (default), 1 = Order A (before upscaling, on the window's render crop), 2 = Order B (after upscaling, on the window's output)
Mode=0
; key that cycles Off -> Order A -> Order B -> Off at runtime (0 = no key, 54 = key 6)
Key=0
; stacked DLSS 5 passes per eye: 1 (default) or 2
Passes=1
; key that switches 1 <-> 2 passes at runtime (0 = no key, 57 = key 9)
PassesKey=0
Intensity=0.8
LocalToneStrength=0.75
LocalStructureStrength=0.9
SkinStructureStrength=0.9
Style=3
UseAutoMask=1
UICorrection=0
Preset=0
